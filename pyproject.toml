[project]
name = "revenue-doctor"
version = "0.1.0"
description = "Diagnoses why a merchant's payment success rate falls short of its cohort, and measures how often it is wrong."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "anthropic>=0.40",
    "langgraph>=0.2.30",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sse-starlette>=2.1",
    "cryptography>=42.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chitragupta", "src/doctor"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
